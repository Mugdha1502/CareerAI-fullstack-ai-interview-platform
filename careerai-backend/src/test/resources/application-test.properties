# =====================================================================================
# "test" profile — every automated JUnit test (Maven Surefire sets spring.profiles.active=test).
# In-memory H2 in MySQL mode, created fresh for each test context and dropped afterwards:
# tests never insert into the careerai development database (TestDatabaseGuard enforces it).
# =====================================================================================
spring.datasource.url=jdbc:h2:mem:careerai_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

app.jwt.secret=test-only-jwt-secret-that-is-at-least-32-bytes-long
app.storage.resume-dir=target/test-uploads

# No external services in automated tests (fakes are injected where needed).
app.ai.gemini.api-key=
app.avatar.simli.api-key=
app.execution.provider=none
app.execution.judge0.base-url=
app.execution.judge0.api-key=
app.execution.jdoodle.client-id=
app.execution.jdoodle.client-secret=

# Billing: no Razorpay credentials (fakes are injected), no scheduled jobs in tests.
app.billing.razorpay.key-id=
app.billing.razorpay.key-secret=
app.billing.razorpay.webhook-secret=
app.billing.expiry-job.enabled=false

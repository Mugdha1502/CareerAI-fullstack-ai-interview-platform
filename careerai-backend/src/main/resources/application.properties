spring.application.name=careerai-backend

# Optional, git-ignored local overrides (see application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

# ---------- MySQL ----------
# Credentials come from environment variables; never commit a real password here.
#   DB_URL       (default: local careerai database, created if missing)
#   DB_USERNAME  (default: root)
#   DB_PASSWORD  (required for a password-protected MySQL user; for local development it can
#                 instead be kept as careerai.local.db-password in application-local.properties)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerai?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${careerai.local.db-password:}}

# ---------- JPA / schema ----------
# Local development: Hibernate 'update' creates/extends tables and Flyway is off, so a developer
# database is never migrated automatically. Deployed (prod profile): Flyway migrations from
# db/migration + ddl-auto=validate. See docs/deployment-backend.md.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.clean-disabled=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# No built-in secret: set JWT_SECRET (32+ random bytes). For local development only, it can instead be
# kept as careerai.local.jwt-secret in the git-ignored application-local.properties.
# The app refuses to start with a missing, short or publicly known secret.
app.jwt.secret=${JWT_SECRET:${careerai.local.jwt-secret:}}
# Token lifetime in milliseconds (86400000 = 24 hours).
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------- CORS ----------
# Comma-separated list of frontend origins allowed to call /api/**.
careerai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Login protection ----------
# Failed logins per account + client IP, and per client IP across accounts, inside a sliding window.
# Over the limit: 429 LOGIN_RATE_LIMITED with Retry-After. In-memory, so per backend instance.
app.security.login.max-failures-per-account=${LOGIN_MAX_FAILURES_PER_ACCOUNT:5}
app.security.login.max-failures-per-ip=${LOGIN_MAX_FAILURES_PER_IP:30}
app.security.login.window=${LOGIN_FAILURE_WINDOW:PT15M}
# Reverse proxies (IPs or CIDR ranges) whose X-Forwarded-For header may be used to find the client IP.
# Empty (default): the header is never trusted. Set it to your host's proxy range when deployed.
app.security.trusted-proxies=${TRUSTED_PROXIES:}

# ---------- Health check ----------
# Only GET /actuator/health is exposed, without details ({"status":"UP"} / 503 when the database is down).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- Errors ----------
# Never expose stack traces or exception messages in HTTP responses.
server.error.include-stacktrace=never
server.error.include-message=never

# ---------- Resume storage ----------
# Uploaded resumes are stored on local disk for development, relative to the
# working directory, and are never served as static files.
app.storage.resume-dir=${RESUME_STORAGE_DIR:uploads/resumes}
# Where file bytes live: local (files under resume-dir; use a persistent disk when deployed) or
# database (resume_file_blobs table; survives redeploys without extra services). Existing local
# files stay readable after switching to database while local-fallback is true.
app.storage.resume-provider=${RESUME_STORAGE_PROVIDER:local}
app.storage.database.local-fallback=${RESUME_STORAGE_LOCAL_FALLBACK:true}
# Maximum resume size enforced by ResumeStorageService (bytes; 5 MB).
app.storage.resume-max-bytes=5242880
# Servlet limits sit slightly above the app limit so oversize files get a clear JSON error.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# ---------- AI (Gemini) ----------
# The key is read from the GEMINI_API_KEY environment variable and never sent to the browser.
# Without it the application still starts; AI endpoints answer 503 and everything else works.
app.ai.gemini.api-key=${GEMINI_API_KEY:}
# Model id used in .../models/{model}:generateContent; override with GEMINI_MODEL.
app.ai.gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.connect-timeout-seconds=10
app.ai.gemini.read-timeout-seconds=${GEMINI_TIMEOUT_SECONDS:90}
# Extra attempts for transient failures only (timeouts, 429, 5xx). Never unlimited.
app.ai.gemini.max-retries=2
# Optional thinking budget for Gemini 2.5 models (0 = off for lower latency); empty = model default.
app.ai.gemini.thinking-budget=${GEMINI_THINKING_BUDGET:}
# Gemini 3 thinking level (e.g. low, high); lower is faster. Empty = model default.
app.ai.gemini.thinking-level=${GEMINI_THINKING_LEVEL:low}
# Gemini 3 models recommend their default temperature; set true to send per-task temperatures.
app.ai.gemini.send-temperature=${GEMINI_SEND_TEMPERATURE:false}
# Per-user AI request limit (cost protection), counted from ai_usage_logs.
app.ai.max-requests-per-hour=${AI_MAX_REQUESTS_PER_HOUR:60}

# ---------- Interviewer avatar (Simli) ----------
# Visual layer only: Vapi keeps the conversation, voice and transcript.
# The key is read from the SIMLI_API_KEY environment variable, stays on the server and is never
# logged or returned; the browser only receives short-lived session tokens.
# Without it the application still starts and voice interviews show the built-in interviewer.
app.avatar.simli.api-key=${SIMLI_API_KEY:}
# Simli face used for the interviewer (not a secret; override with SIMLI_FACE_ID).
app.avatar.simli.face-id=${SIMLI_FACE_ID:9fcd5739-bf66-49a5-b525-d02d7f0bc2fc}
app.avatar.simli.base-url=${SIMLI_BASE_URL:https://api.simli.ai}
# Free-plan protection: Simli ends a session after this many seconds / seconds without audio.
app.avatar.simli.max-session-seconds=${SIMLI_MAX_SESSION_SECONDS:1800}
app.avatar.simli.max-idle-seconds=${SIMLI_MAX_IDLE_SECONDS:120}
# Avatar sessions allowed per voice interview (the first one plus "Retry Avatar").
app.avatar.simli.max-sessions-per-interview=3
app.avatar.simli.timeout-seconds=15

# ---------- Coding practice: external sandboxed execution ----------
# Candidate code is NEVER run inside this application: it is sent to an external sandbox.
#   CODE_EXECUTION_PROVIDER  jdoodle (default) | judge0 | none
# Without the selected provider's credentials the app still starts and the execution endpoints
# answer 503 "Code execution is temporarily unavailable". Credentials stay on the server only.
app.execution.provider=${CODE_EXECUTION_PROVIDER:jdoodle}

# JDoodle Compiler API (default): POST {JDOODLE_BASE_URL}/v1/execute, one credit per call.
#   JDOODLE_CLIENT_ID / JDOODLE_CLIENT_SECRET   from the JDoodle API dashboard (never logged or sent to the browser)
#   JDOODLE_BASE_URL                            default https://api.jdoodle.com
#   JDOODLE_LANGUAGE_VERSIONS                   optional override of the pinned language:versionIndex map,
#                                               e.g. JAVA=java:5,PYTHON=python3:5,CPP=cpp17:3,JAVASCRIPT=nodejs:5
app.execution.jdoodle.base-url=${JDOODLE_BASE_URL:https://api.jdoodle.com}
app.execution.jdoodle.client-id=${JDOODLE_CLIENT_ID:}
app.execution.jdoodle.client-secret=${JDOODLE_CLIENT_SECRET:}
app.execution.jdoodle.language-versions=${JDOODLE_LANGUAGE_VERSIONS:}
app.execution.jdoodle.connect-timeout-seconds=5
app.execution.jdoodle.read-timeout-seconds=15

# Judge0 CE (optional, CODE_EXECUTION_PROVIDER=judge0): self-hosted, hosted or RapidAPI.
#   JUDGE0_BASE_URL          e.g. http://localhost:2358 or https://judge0-ce.p.rapidapi.com
#   JUDGE0_API_KEY           Judge0 auth token or RapidAPI key (never logged or sent to the browser)
#   JUDGE0_API_HOST          set ONLY for RapidAPI (sends X-RapidAPI-Key / X-RapidAPI-Host)
#   JUDGE0_AUTH_HEADER       header for JUDGE0_API_KEY on non-RapidAPI instances (default X-Auth-Token)
#   JUDGE0_LANGUAGE_IDS      optional override, e.g. JAVA=62,PYTHON=71,CPP=54,JAVASCRIPT=63
app.execution.judge0.base-url=${JUDGE0_BASE_URL:}
app.execution.judge0.api-key=${JUDGE0_API_KEY:}
app.execution.judge0.api-host=${JUDGE0_API_HOST:}
app.execution.judge0.auth-header=${JUDGE0_AUTH_HEADER:X-Auth-Token}
app.execution.judge0.language-ids=${JUDGE0_LANGUAGE_IDS:}
# Sandbox limits sent with every Judge0 submission (the client can never change them).
# JDoodle applies its own fixed limits (its API has no limit fields).
app.execution.cpu-time-limit-seconds=2.5
app.execution.wall-time-limit-seconds=5
app.execution.memory-limit-kb=256000
app.execution.max-processes=60
app.execution.max-file-size-kb=1024
# Judge0 polling (no wait=true): every 400 ms, at most 10 s per run or submission batch.
app.execution.poll-interval-ms=400
app.execution.max-wait-ms=10000
app.execution.max-output-chars=51200

# ---------- SQL practice sandbox (disposable in-memory H2, never the CareerAI database) ----------
app.practice.sql.query-timeout-seconds=3
app.practice.sql.max-rows=200
app.practice.sql.max-columns=30
app.practice.sql.max-concurrent=4

# ---------- Practice execution rate limits (per user, per minute) ----------
app.practice.rate.code-run-per-minute=10
app.practice.rate.code-submit-per-minute=5
app.practice.rate.sql-run-per-minute=20
app.practice.rate.sql-submit-per-minute=10

# ---------- Plans, usage limits and PRO payments (Razorpay) ----------
# Plan limits live in PlanCatalog (FREE / PRO). Any limit can be overridden without code changes:
#   app.billing.limits.<FREE|PRO>.<FEATURE_KEY>=<n>   e.g. app.billing.limits.FREE.CODING_RUN=20
# Daily / monthly usage windows follow the calendar in this zone.
app.billing.usage-zone=${BILLING_USAGE_ZONE:Asia/Kolkata}
# PRO prices in paise (smallest INR unit) - decided ONLY by the server: 29900 = Rs 299, 249900 = Rs 2,499.
app.billing.pro.monthly-amount-paise=${PRO_MONTHLY_AMOUNT_PAISE:29900}
app.billing.pro.annual-amount-paise=${PRO_ANNUAL_AMOUNT_PAISE:249900}
# Razorpay (use TEST MODE keys rzp_test_... until going live). Without keys the app starts,
# plans are shown and checkout answers 503 PAYMENT_GATEWAY_UNAVAILABLE.
#   RAZORPAY_KEY_ID          public key id (sent to Checkout in the order response)
#   RAZORPAY_KEY_SECRET      server only: Basic auth + payment signature HMAC (never logged or sent to the browser)
#   RAZORPAY_WEBHOOK_SECRET  server only: webhook HMAC (never logged or sent to the browser)
app.billing.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.billing.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.billing.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.billing.razorpay.currency=${RAZORPAY_CURRENCY:INR}
app.billing.razorpay.base-url=${RAZORPAY_BASE_URL:https://api.razorpay.com}
app.billing.razorpay.timeout-seconds=15
# Housekeeping job that marks ended PRO periods EXPIRED (entitlement never depends on it).
app.billing.expiry-job.enabled=true

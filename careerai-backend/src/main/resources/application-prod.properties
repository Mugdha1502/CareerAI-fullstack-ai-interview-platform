# =====================================================================================
# "prod" profile — deployed backend (SPRING_PROFILES_ACTIVE=prod).
# Nothing here has a local default: a missing variable stops startup instead of silently
# falling back to localhost, a public secret or a development database.
# =====================================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Signing secret from the environment only (no application-local.properties fallback).
app.jwt.secret=${JWT_SECRET}

# Exact frontend origin(s), e.g. https://careerai.example.com
careerai.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Schema: Flyway applies the versioned scripts in db/migration, then Hibernate only validates.
# Hibernate never changes a deployed schema on its own, and Flyway clean is disabled.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
# Existing database created before Flyway (tables present, no flyway_schema_history): set
# FLYWAY_BASELINE_ON_MIGRATE=true for ONE start after a backup, so V1 is recorded as already applied
# (never executed) and only later scripts run. Leave it false otherwise: Flyway then refuses to touch
# a non-empty database it does not know. Procedure: docs/deployment-backend.md.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema before Flyway

# Most hosts have an ephemeral filesystem, so resume bytes go to the database unless a persistent
# disk is configured (RESUME_STORAGE_PROVIDER=local with RESUME_STORAGE_DIR on that disk).
app.storage.resume-provider=${RESUME_STORAGE_PROVIDER:database}

# Container platforms pass the port in; SERVER_PORT also works.
server.port=${PORT:8080}

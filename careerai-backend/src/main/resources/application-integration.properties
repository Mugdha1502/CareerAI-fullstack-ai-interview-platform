# =====================================================================================
# "integration" profile — a running backend for end-to-end/integration test scripts.
#   java ... --spring.profiles.active=integration   (or SPRING_PROFILES_ACTIVE=integration)
# Uses the separate careerai_test MySQL database (MySQL semantics), recreated on every start
# and dropped on shutdown, so generated test users never reach the careerai database.
# TestDatabaseGuard refuses to start if this URL is changed to a non-*_test database.
# =====================================================================================
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/careerai_test?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.jpa.hibernate.ddl-auto=create-drop
app.storage.resume-dir=${TEST_RESUME_STORAGE_DIR:target/integration-uploads}

# End-to-end regression scripts create many interviews/runs per test user: raise FREE limits for this
# profile only (JUnit tests under the "test" profile keep the real FREE/PRO limits and test them).
app.billing.limits.FREE.AI_TEXT_INTERVIEW=1000
app.billing.limits.FREE.AI_VOICE_INTERVIEW=1000
app.billing.limits.FREE.AI_COACH_MESSAGE=1000
app.billing.limits.FREE.RESUME_ATS_ANALYSIS=1000
app.billing.limits.FREE.RESUME_JOB_MATCH=1000
app.billing.limits.FREE.RESUME_AI_IMPROVEMENT=1000
app.billing.limits.FREE.RESUME_INTERVIEW_PREP=1000
app.billing.limits.FREE.CODING_RUN=1000
app.billing.limits.FREE.CODING_SUBMIT=1000
app.billing.limits.FREE.SQL_RUN=1000
app.billing.limits.FREE.SQL_SUBMIT=1000
app.billing.expiry-job.enabled=false
